server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: liushao_community_backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/liushao_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 20MB
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
liushao:
  jwt:
    secret: ${JWT_SECRET}
    expire: ${JWT_EXPIRE_SECONDS:86400}
