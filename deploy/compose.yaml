name: ${COMPOSE_PROJECT_NAME:-liushao}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  restart: unless-stopped
  stop_grace_period: 40s
  init: true
  logging: *logging
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-deploy.py first}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?Set COMMUNITY_DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$ADMIN_DB_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uadmin_app liushao_community -Nse 'SELECT 1' >/dev/null &&
          MYSQL_PWD="$$COMMUNITY_DB_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -ucommunity_app liushao_community -Nse 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", 'exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 6

  admin-api:
    <<: *api
    build: ../../authority_management_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/liushao_community?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: admin_app
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "12"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COMMUNITY_API_URL: http://community-api:8080
      COMMUNITY_ADMIN_KEY: ${COMMUNITY_ADMIN_KEY:?Set a separate COMMUNITY_ADMIN_KEY}

  community-api:
    <<: *api
    build: ..
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/liushao_community?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: community_app
      DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?Set COMMUNITY_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "13"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      JWT_SECRET: ${COMMUNITY_JWT_SECRET:?Set COMMUNITY_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${COMMUNITY_ORIGIN:-http://localhost:8088}
      COMMUNITY_ADMIN_KEY: ${COMMUNITY_ADMIN_KEY:?Set a separate COMMUNITY_ADMIN_KEY}
      UPLOAD_DIRECTORY: /app/data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - community-uploads:/app/data/uploads

  admin-web:
    build: ../../authority_management_frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-8089}:8080"
    depends_on:
      admin-api:
        condition: service_healthy

  community-web:
    build: ../../liushao_community_frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMMUNITY_HTTP_PORT:-8088}:8080"
    depends_on:
      community-api:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  community-uploads:
